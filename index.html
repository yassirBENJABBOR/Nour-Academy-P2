<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login</title>
</head>
<body class="m-0 box-border">
    <main class="bg-[#023e8a] min-h-screen flex items-center justify-center p-4">
        <section id="Login" class="bg-[#0077b6]  min-w-md p-6 rounded-2xl shadow-lg">
                <h1 class="text-2xl font-bold text-white text-center mb-6">Connexion Nour Academy</h1>
                <form id="loginForm" class="gap-4 flex flex-col">
                    <div class="flex flex-col gap-2">
                        <label for="email" class="text-white">Email</label>
                        <input id="email" type="email" placeholder = "Enter Email" required class="w-full p-3 rounded-lg bg-white">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="password" class="text-white">Mode de passe</label>
                        <input id="modePasse" type="password" placeholder="Enter le mode de passe" name="passe" required class="w-full p-3 rounded-lg bg-white">
                    </div>
                    <div class="flex justify-center pt-3 hover:red">
    
                        <button id="conecte" type="submit" class="bg-[#023e8a] text-white rounded-lg p-3 font-bold cursor-pointer hover:bg-blue-950">Conecte</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
